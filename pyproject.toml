[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "character-performance-capture"
version = "1.1.0"
description = "Local-first, model-agnostic character performance capture pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
tracker-mediapipe = [
  # 1.0.x aborts the process on headless macOS/arm64 (GPU delegate has no
  # Metal/GL service); 0.10.35 with the CPU delegate is the validated range.
  "mediapipe>=0.10.35,<0.11",
]
output-virtualcam = [
  "pyvirtualcam>=0.11,<1",
]
ui = [
  "PySide6>=6.6,<7",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
cpc = "cpc.app:main"
cpc-ui = "cpc.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
